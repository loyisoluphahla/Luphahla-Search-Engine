app = "lupahla-search-engine"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "info"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

# Volume mounts to a DATA subfolder, NOT /app (which holds your code)
[mounts]
  source = "search_data"
  destination = "/app/data"
